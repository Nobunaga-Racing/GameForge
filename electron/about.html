<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>À propos de GameForge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 14px;
      color: #aaa;
      margin: 5px 0;
    }
    .version {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #333;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 GameForge</h1>
    <p>Professional Desktop Game Server Manager</p>
    <p>Version 1.0.0</p>
    <div class="version">
      <p>© 2025 Nobunaga Racing</p>
      <p>Tous droits réservés</p>
    </div>
  </div>
</body>
</html>
